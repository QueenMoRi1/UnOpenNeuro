# Copy this file to config.yaml and edit it. Every key is optional.

llm:
  # Ollama's default address. Install Ollama from https://ollama.com
  base_url: http://localhost:11434
  # Start with a stock model (`ollama pull qwen3:4b`), then swap in your
  # fine-tuned one (e.g. `neuro`) once you have trained it.
  model: qwen3:4b
  temperature: 0.9
  # Seconds to wait for one reply before giving up.
  timeout: 120

persona:
  name: Neuro
  creator: Vedal
  # Extra lines appended to the built-in persona prompt.
  extra: ""

neuro_api:
  # Games connect to ws://<host>:<port> (the SDK default is ws://localhost:8000).
  host: 127.0.0.1
  port: 8000
  # How many times to retry a forced action after the game reports failure.
  max_retries: 3
  # Let her act on registered actions without being forced, every N seconds.
  # 0 turns spontaneous actions off.
  idle_action_interval: 0
  # How many context messages to remember per game.
  context_window: 40

voice:
  # none | system | kokoro
  #   system = espeak-ng on Linux, the built-in voice on Windows/macOS. Robotic.
  #   kokoro = free open-source voice, sounds much better, runs on the CPU.
  tts: none
  kokoro_voice: af_heart
  # Playback speed/pitch multiplier. Neuro's voice is a pitched-up TTS voice;
  # 1.15-1.3 gets you in the right area.
  pitch: 1.2
  # Speech-to-text model for `unopenneuro chat --listen`.
  whisper_model: base.en

vtube_studio:
  enabled: false
  url: ws://localhost:8001
  # Filled in for you by `unopenneuro vts-auth`.
  token: ""
  mouth_parameter: MouthOpen
